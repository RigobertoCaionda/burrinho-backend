name: ci-burrinho-game-workflow
on:
  pull_request:
    branches:
      - develop

jobs:
  check-application:
    runs-on: ubuntu-latest
    
    steps:
      - name: Cloning the Project
        uses: actions/checkout@v2
      
      - name: Seting Up Node Environment
        uses: actions/setup-node@v4

        with:
          node-version: 20
          # cache npm cachea o node_modules, não precisa baixar o node_modules toda vez que a ci rodar, a não ser que o package.json mudou.
          cache: 'npm'
      
      - name: Installing dependencies
      # npm ci: melhor que npm install em ci
        run: npm ci

      - name: Running Tests
        run: npm test
        # Para rodar os testes, é necessário algumas variáveis de ambiente e podemos passar elas aqui e nos secrets do repositório para não passar diretamente aqui.
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DRIVE_DISK: ${{ secrets.DRIVE_DISK }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_DB_NAME: ${{ secrets.MYSQL_DB_NAME }}
          DB_CONNECTION: mysql

      - name: Running the Project
        run: npm run dev
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DRIVE_DISK: ${{ secrets.DRIVE_DISK }}
          NODE_ENV: development
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}

      # Apenas uma validação para ver se o nosso projeto builda em produção
      - name: Building the Project
        run: node ace build --ignore-ts-errors
